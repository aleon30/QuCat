name: Desplegar QuCat en GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Pygbag
        run: |
          python -m pip install --upgrade pip
          pip install pygbag==0.8.6

      - name: Compilar el juego con Pygbag
        run: |
          # Generar la versión estática
          python -m pygbag --build --app_name index .

      - name: Crear archivo .nojekyll
        run: |
          touch build/web/.nojekyll

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v4

      - name: Subir artefacto para Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build/web'

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4